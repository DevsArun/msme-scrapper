name: Premium Lead Scraper

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'CSV file ka naam (e.g., gaya.csv)'
        required: true
        default: 'gaya.csv'
      start_row:
        description: 'Kahan se start karein? (Pehli baar 0 rakhein)'
        required: true
        default: '0'
      total_leads:
        description: 'Ek baar mein kitne leads nikalne hain? (Safe limit: 300 - 500)'
        required: true
        default: '300'

jobs:
  scrape-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          wget -q -O google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome.deb
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl selenium beautifulsoup4

      - name: Run Scraper in Batches (Live Updates)
        run: python -u scraper.py ${{ github.event.inputs.filename }} ${{ github.event.inputs.start_row }} ${{ github.event.inputs.total_leads }}

      - name: Upload Leads Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extracted_Leads_Contacts
          path: premium_leads_contacts.*
