name: Ultimate MSME Tech Scraper

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'CSV file ka naam (e.g., gaya.csv)'
        required: true
        default: 'gaya.csv'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          wget -q -O google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome.deb
          google-chrome --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl selenium beautifulsoup4

      - name: Run Deep Scraper (Real-Time)
        run: python -u scraper.py ${{ github.event.inputs.filename }}

      - name: Upload Final Leads
        uses: actions/upload-artifact@v4
        with:
          name: Fresh_Tech_Leads
          path: fresh_tech_leads.*
